name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache-dependency-path: native/transport/go.sum
      - run: npm ci
      - run: npm run check
      - name: Download native dependencies with bounded retries
        working-directory: native/transport
        run: |
          for attempt in 1 2 3; do
            if go mod download; then exit 0; fi
            sleep 5
          done
          exit 1
      - run: go test ./...
        working-directory: native/transport
      - run: npm run native:build
      - run: node scripts/package-release.mjs
      - run: node scripts/verify-service.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-${{ matrix.runner }}
          path: |
            release/relay-node-*.tar.gz
            release/relay-node-sdk-*.tgz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: artifacts
      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir release
          cp "artifacts/node-ubuntu-24.04/relay-node-$version-linux-x64.tar.gz" \
            "artifacts/node-ubuntu-24.04-arm/relay-node-$version-linux-arm64.tar.gz" \
            "artifacts/node-ubuntu-24.04/relay-node-sdk-$version.tgz" release/
          cd release
          gzip -t relay-node-*.tar.gz relay-node-sdk-*.tgz
          sha256sum relay-node-*.tar.gz relay-node-sdk-*.tgz > SHA256SUMS
          gh release create "v$version" --repo "$GITHUB_REPOSITORY" --draft --title "Relay Node v$version" --generate-notes
          gh release upload "v$version" ./*.tar.gz ./*sdk*.tgz SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --draft=false --latest
